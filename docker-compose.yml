services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-health}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-health}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-health}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-health}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-health}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
    volumes:
      - ./data/uploads:/app/uploads
    ports:
      - "8501:8501"

  api:
    build: .
    restart: unless-stopped
    command: ["uvicorn", "api:app", "--app-dir", "app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-health}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-health}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
      HEALTH_API_KEY: ${HEALTH_API_KEY:-}
      MAX_API_BODY_BYTES: ${MAX_API_BODY_BYTES:-10485760}
    ports:
      - "3001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10

  scheduler:
    build: .
    restart: unless-stopped
    command: ["python", "app/worker.py"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-health}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-health}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}

  mcp:
    build: .
    profiles: ["tools"]
    command: ["python", "app/mcp_server.py"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-health}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-health}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
    stdin_open: true

volumes:
  pgdata:
